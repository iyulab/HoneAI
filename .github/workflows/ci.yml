name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore
      run: dotnet restore HoneAI.slnx

    - name: Build
      run: dotnet build HoneAI.slnx --configuration Release --no-restore

    # The import-boundary tests (HoneAI.Tests/ImportBoundaryTests) run here — the guard for
    # one-way dependencies, the zero-dependency contract floor and no MLoop ProjectReference.
    # CI uploads no artifacts.
    - name: Test
      run: dotnet test HoneAI.slnx --configuration Release --no-build --verbosity normal

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Check vulnerable packages
      run: |
        dotnet restore HoneAI.slnx
        dotnet list HoneAI.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        # A High or Critical advisory fails the job; Moderate and Low are reported. A warning alone was
        # read by no one: a High advisory reached a published package that way.
        if grep -Eq '^\s*>.*\b(High|Critical)\b' vulnerability-report.txt; then
          echo "::error::High or Critical vulnerable package. See the report above."
          exit 1
        elif grep -q "has the following vulnerable packages" vulnerability-report.txt; then
          echo "::warning::Vulnerable packages detected (Moderate or Low). See the report above."
        fi
