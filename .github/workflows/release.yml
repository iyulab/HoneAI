name: Release

# HoneAI.Abstractions / HoneAI.Core / HoneAI.Agents 를 nuget.org 에 배포한다.
# 트리거: Directory.Build.props 의 <Version> 변경(버전 상승) 또는 수동(workflow_dispatch).
# 전제: 신뢰 게시(NuGet/login, 환경 release)로 받은 단명 키를 먼저 쓰고, 실패하면 NUGET_API_KEY 로 폴백한다.
# 세 패키지는 Directory.Build.props 의 단일 <Version> 을 공유한다(동시 상승).

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 릴리스 태그 push
  id-token: write   # 신뢰 게시(NuGet/login)의 OIDC 토큰

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from Directory.Build.props"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists — skipping release."
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION"

      - name: Cache NuGet packages
        if: steps.version.outputs.tag_exists == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        if: steps.version.outputs.tag_exists == 'false'
        run: dotnet restore HoneAI.slnx

      - name: Build
        if: steps.version.outputs.tag_exists == 'false'
        run: dotnet build HoneAI.slnx --configuration Release --no-restore

      - name: Test
        if: steps.version.outputs.tag_exists == 'false'
        run: dotnet test HoneAI.slnx --configuration Release --no-build --verbosity normal

      - name: Pack HoneAI.Abstractions
        if: steps.version.outputs.tag_exists == 'false'
        run: dotnet pack src/HoneAI.Abstractions/HoneAI.Abstractions.csproj --configuration Release --no-build -o ./nupkg

      - name: Pack HoneAI.Core
        if: steps.version.outputs.tag_exists == 'false'
        run: dotnet pack src/HoneAI.Core/HoneAI.Core.csproj --configuration Release --no-build -o ./nupkg

      - name: Pack HoneAI.Agents
        if: steps.version.outputs.tag_exists == 'false'
        run: dotnet pack src/HoneAI.Agents/HoneAI.Agents.csproj --configuration Release --no-build -o ./nupkg

      - name: NuGet login (trusted publishing)
        id: login
        if: steps.version.outputs.tag_exists == 'false'
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Warn when falling back to the long-lived key
        if: steps.version.outputs.tag_exists == 'false' && steps.login.outcome != 'success'
        run: echo "::warning::NuGet trusted-publishing login failed; pushing with NUGET_API_KEY"

      - name: Push to NuGet.org
        if: steps.version.outputs.tag_exists == 'false'
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag release
        if: steps.version.outputs.tag_exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
